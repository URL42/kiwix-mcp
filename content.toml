# ZIM archives to keep on bossbitch, refreshed quarterly by refresh.py.
#
# dir:  directory under https://download.kiwix.org/zim/
# name: filename without the _YYYY-MM.zim suffix. It's also the stable source
#       name the MCP tools use (kiwix-serve runs with --nodatealiases).
#
# Approximate sizes as of 2026-10 in the comments.

